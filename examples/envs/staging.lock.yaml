# Generated by the engine. Do not edit by hand.
# Lock of the `staging` environment (ADR-029, ADR-030): the base from `prosa.lock.yaml` plus the patch that the
# planner derived from `envs/staging.md` (the intent's section and the common lines).
# Every environment has its own lock, next to its file, and its own state in `.prosa/state.d/staging/`.
# `base_hash` is the intent_hash of the base it derives from: if the base changes and the environment part does not,
# the engine reapplies `patch` without calling the model. `resources` is the result, already applied.
# Semantics: "for this sentence I chose this". It holds decisions only, and is committed (ADR-010).
# Never sensitive values, neither here nor in the patch (ADR-011).
# The ownership tags prosa/intent=<intent> and prosa/env=staging are added by the engine and do not appear here.
version: 1
provider_versions:
  hashicorp/aws: 6.69.1          # per environment: staging can upgrade the provider before prod
intents:
  database:
    intent_hash: sha256:9b1e...      # base of database + `## database` section + staging common lines
    base_hash: sha256:3f9c...        # intent_hash of database in prosa.lock.yaml
    patch:                           # what staging changes relative to the base
      - { op: set, key: db.instance, path: engine_version, value: "18.1" }
      - { op: set, key: db.instance, path: allocated_storage, value: 40 }
      - { op: set, key: db.instance, path: tags.env, value: staging }
      - { op: set, key: db.subnet_group, path: tags.env, value: staging }
      - { op: set, key: db.security_group, path: tags.env, value: staging }
    recipe: null
    reconciled_at: 2026-10-20T09:40:00Z
    state:                           # pointer to staging's state store
      serial: 3
      digest: sha256:c41d...
    resources:
      - key: db.instance
        provider: hashicorp/aws
        type: aws_db_instance
        id: main-db-20261020094000000000000001
        chosen:
          identifier_prefix: main-db-
          engine: postgres
          engine_version: "18.1"                 # patch: Postgres 18 (the base says 17)
          instance_class: db.t4g.small
          allocated_storage: 40                  # patch: 40 GB (the base says 20)
          storage_encrypted: true
          backup_retention_period: 7
          backup_window: "02:00-03:00"
          username: app_admin
          manage_master_user_password: true
          db_subnet_group_name: "${database/db.subnet_group.name}"
          vpc_security_group_ids: ["${database/db.security_group.id}"]
          tags: { team: platform, env: staging }
      - key: db.subnet_group
        provider: hashicorp/aws
        type: aws_db_subnet_group
        id: main-db-subnets-20261020094000000000000002
        chosen:
          name_prefix: main-db-subnets-
          subnet_ids: ["${app/net.private_a.id}", "${app/net.private_b.id}"]
          tags: { team: platform, env: staging }
      - key: db.security_group
        provider: hashicorp/aws
        type: aws_security_group
        id: sg-0e5f
        chosen:
          name_prefix: main-db-
          description: Postgres, only from the app's private network
          vpc_id: "${app/net.vpc.id}"
          tags: { team: platform, env: staging }
    checks:
      - name: "The database accepts connections from the private subnet and rejects them from the internet."
        type: resource_attr
        resource: database/db.instance
        path: publicly_accessible
        op: eq
        value: false
      - name: "There is at least one backup newer than 24 hours (after the first day)."
        type: resource_attr
        resource: database/db.instance
        path: latest_restorable_time
        op: within
        value: 24h
      - name: "Storage is encrypted."
        type: resource_attr
        resource: database/db.instance
        path: storage_encrypted
        op: eq
        value: true
